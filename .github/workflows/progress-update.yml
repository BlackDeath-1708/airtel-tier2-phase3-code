name: phase3-progress-update

# Posts the scan's progress to the Discord channel on demand. The running scan posts every 2 hours itself,
# because GitHub's schedule does not start these runs reliably. This only reads the saved status, so it does
# not take the scan's lock and does not start a scan.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  STATE_REPO: BlackDeath-1708/airtel-tier2-phase3

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Post the progress update
        env:
          GH_TOKEN: ${{ secrets.STATE_TOKEN }}
          GH_REPO: ${{ env.STATE_REPO }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m phase3.notify --outcome progress
